[package]
name = "hanzo-flags-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust client for the Hanzo native flags engine (cloud /v1/flags) — PostHog-compatible shapes"
repository = "https://github.com/hanzoai/flags"
documentation = "https://docs.hanzo.ai/docs/flags"
keywords = ["feature-flags", "ab-testing", "experiments", "hanzo"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
